apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway-api
  namespace: llm-gateway
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway-api
    spec:
      containers:
        - name: api
          image: ghcr.io/dileep-u-k/llm-gateway:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: llm-gateway-config
            - secretRef:
                name: llm-gateway-secrets
          env:
            - name: HTTP_ENABLED
              value: "true"
            - name: ASYNC_WORKERS_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: artifact-storage
              mountPath: /var/lib/llm-gateway/artifacts
      volumes:
        - name: artifact-storage
          emptyDir: {}
