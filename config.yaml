# config.yaml
# Autonomous AI Orchestration
# Production-Grade Control Plane Configuration
# vNext — full end-to-end platform config
#
# Notes:
# - Keep hardcoded price/model values minimal where possible.
# - In production, refresh provider/model catalogs from provider APIs or scheduled metadata sync.
# - "quality_score", "reasoning_score", etc. are initial priors; real ranking should be adjusted by evals.

version: "2.0"

environment:
  name: "production"
  region: "global"
  default_timezone: "UTC"
  config_refresh_interval: "15m"

# ================================================================
# GLOBAL ORCHESTRATION SETTINGS
# ================================================================
orchestration:
  request_timeout: "60s"
  default_sync_timeout: "25s"
  max_stage_count_sync: 6
  max_stage_count_async: 20
  default_async_threshold_seconds: 20
  route_explanation_enabled: true
  orchestration_metadata_ttl: "24h"
  request_replay_ttl: "7d"
  enable_shadow_routing: true
  enable_canary_routing: true

# ================================================================
# SESSION + FORCE SEMANTICS
# ================================================================
session:
  backend: "redis"
  session_ttl: "72h"
  summary_memory_refresh_interval: 5
  max_short_term_turns: 12
  preserve_artifact_refs: true

force_semantics:
  supported_scopes:
    - primary_reasoner_force
    - capability_scoped_force
    - strict_end_to_end_force

  default_scope: primary_reasoner_force
  allow_mid_session_force_override: true
  strict_force_default: false
  allow_failover_when_strict_force: false
  allow_auxiliary_stages_when_primary_reasoner_forced: true

  capability_scoped_bindings:
    text_generation:
      default_stage_roles: ["planner", "reasoner", "final_synthesizer"]
    image_generation:
      default_stage_roles: ["image_generator"]
    image_editing:
      default_stage_roles: ["image_editor"]
    transcription:
      default_stage_roles: ["transcriber"]
    tts:
      default_stage_roles: ["speech_synthesizer"]

# ================================================================
# HEALTH, CIRCUIT BREAKERS, AND PRE-CHECKS
# ================================================================
pre_check_thresholds:
  max_error_rate: 0.15
  min_request_count: 20
  health_check_staleness: "5m"
  relevance_threshold: 0.45
  min_rerank_score: 0.50
  max_queue_wait_sync: "2s"
  max_stage_retry_count: 2

health:
  provider_probe_interval: "60s"
  model_probe_interval: "90s"
  capability_probe_interval: "120s"

  health_states:
    - online
    - degraded
    - offline
    - unknown
    - rate_limited

  degrade_thresholds:
    error_rate: 0.10
    timeout_rate: 0.08
    p95_latency_ms: 8000

  offline_thresholds:
    consecutive_failures: 3
    auth_failures: 2

circuit_breakers:
  enabled: true
  failure_threshold: 3
  cooldown: "2m"
  half_open_probe_count: 1

# ================================================================
# COST / LATENCY SMART THRESHOLDS
# ================================================================
routing_thresholds:
  smart_balanced_cost_threshold_usd: 0.001
  high_complexity_token_threshold: 12000
  async_candidate_duration_seconds: 20
  image_generation_async_default: true
  video_always_async_minutes: 5
  audio_async_default_minutes: 10

# ================================================================
# PROVIDER REGISTRY
# ================================================================
providers:
  openai:
    endpoint: "https://api.openai.com/v1"
    regions: ["global", "us"]
    supports_catalog_sync: true
    default_headers_required: true

  anthropic:
    endpoint: "https://api.anthropic.com"
    regions: ["global", "us"]
    supports_catalog_sync: false
    default_headers_required: true

  google:
    endpoint: "https://generativelanguage.googleapis.com"
    regions: ["global"]
    supports_catalog_sync: true
    default_headers_required: true

  mistral:
    endpoint: "https://api.mistral.ai"
    regions: ["global", "eu"]
    supports_catalog_sync: true
    default_headers_required: true

# ================================================================
# CAPABILITY REGISTRY
# ================================================================
capabilities:
  text_generation:
    description: "General-purpose reasoning, synthesis, coding, and chat completion."
    modalities_in: ["text", "document", "image", "audio", "video", "multimodal"]
    modalities_out: ["text", "json"]
    async_likely: false

  embeddings:
    description: "Dense vector embedding generation for retrieval and semantic similarity."
    modalities_in: ["text", "document"]
    modalities_out: ["vector"]
    async_likely: false

  ocr:
    description: "Document and image OCR plus structured text extraction."
    modalities_in: ["document", "image"]
    modalities_out: ["text", "json"]
    async_likely: true

  image_understanding:
    description: "Vision understanding, image analysis, captioning, and screenshot reasoning."
    modalities_in: ["image"]
    modalities_out: ["text", "json"]
    async_likely: false

  image_generation:
    description: "Native image generation from prompts or conditioned inputs."
    modalities_in: ["text", "image"]
    modalities_out: ["image"]
    async_likely: true

  image_editing:
    description: "Editing or transforming existing images."
    modalities_in: ["image", "text"]
    modalities_out: ["image"]
    async_likely: true

  transcription:
    description: "Speech-to-text transcription, optionally with diarization."
    modalities_in: ["audio", "video"]
    modalities_out: ["text", "json"]
    async_likely: true

  tts:
    description: "Text-to-speech synthesis."
    modalities_in: ["text"]
    modalities_out: ["audio"]
    async_likely: true

  video_understanding:
    description: "Video interpretation, scene reasoning, multimodal summary."
    modalities_in: ["video"]
    modalities_out: ["text", "json"]
    async_likely: true

  video_generation_hook:
    description: "Video generation orchestration hook for future provider integrations."
    modalities_in: ["text", "image", "audio", "multimodal"]
    modalities_out: ["video", "job_ref"]
    async_likely: true

