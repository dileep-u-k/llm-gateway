# config.yaml
# Centralized config for routing, thresholds, and strategies.
# 100% Production-Ready Version

# ================================================================
# Pre-check thresholds
# ================================================================
pre_check_thresholds:
  max_error_rate: 0.15          # Skip models with >15% error rate
  min_request_count: 20         # Only apply error check after 20 requests
  health_check_staleness: "5m"  # Consider model unhealthy if health check is older than 5 minutes
  relevance_threshold: 0.45     # Min similarity score for RAG context

# ================================================================
# Smart-Balanced Thresholds
# ================================================================
smart_balanced_cost_threshold: 0.001  # Below this cost, prioritize latency

# ================================================================
# Models Metadata
# ================================================================
# Each model should have quality, coding, latency, reliability, and cost scores
models:
  gpt-4o:
    quality_score: 9.8
    coding_score: 9.9
    #latency_score: 0.8
    #reliability_score: 0.95
    #cost_score: 0.3

  gemini-1.5-flash-latest:
    quality_score: 8.0
    coding_score: 8.2
    #latency_score: 0.9
    #reliability_score: 0.9
    #cost_score: 0.5

  claude-sonnet-4-20250514:
    quality_score: 9.2
    coding_score: 9.5
    #latency_score: 0.85
    #reliability_score: 0.93
    #cost_score: 0.4

  mistral-large-latest:
    quality_score: 8.8
    coding_score: 8.5
    #latency_score: 0.88
    #reliability_score: 0.92
    #cost_score: 0.6

# ================================================================
# Strategy Definitions
# ================================================================
# Each strategy assigns weights to quality, cost, latency, and reliability.
# If "use_coding_score" is true, coding_score replaces quality_score.
strategies:
  default:
    quality_weight: 0.5
    cost_weight: 0.2
    latency_weight: 0.1
    reliability_weight: 0.2

  max_quality:
    quality_weight: 0.7
    cost_weight: 0.1
    latency_weight: 0.1
    reliability_weight: 0.1

  cost:
    quality_weight: 0.1
    cost_weight: 0.6
    latency_weight: 0.1
    reliability_weight: 0.2

  latency:
    quality_weight: 0.1
    cost_weight: 0.1
    latency_weight: 0.6
    reliability_weight: 0.2

  balanced:
    quality_weight: 0.4
    cost_weight: 0.3
    latency_weight: 0.2
    reliability_weight: 0.1

  best-for-coding:
    use_coding_score: true
    quality_weight: 0.6
    cost_weight: 0.1
    latency_weight: 0.1
    reliability_weight: 0.2

  quality-focused-balanced:
    quality_weight: 0.5
    cost_weight: 0.2
    latency_weight: 0.15
    reliability_weight: 0.15

  latency-focused-balanced:
    quality_weight: 0.3
    cost_weight: 0.25
    latency_weight: 0.3
    reliability_weight: 0.15
