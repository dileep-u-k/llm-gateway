# ================================================================
# Model Cost Data (REQUIRED for accurate profiling and routing)
# ================================================================
model_costs:
  gpt-4o:
    input: 0.000005   # $5.00 / 1M tokens
    output: 0.00002   # $20.00 / 1M tokens
  gemini-1.5-flash-latest:
    input: 0.000000075 # $0.075 / 1M tokens
    output: 0.0000003 # $0.30 / 1M tokens
  claude-sonnet-4-20250514:
    input: 0.000003   # $3.00 / 1M tokens
    output: 0.000015  # $15.00 / 1M tokens
  mistral-large-latest:
    input: 0.000002   # $2.00 / 1M tokens
    output: 0.000006  # $6.00 / 1M tokens

# ================================================================
# Strategy Definitions
# ================================================================
# Each strategy assigns weights to quality, cost, latency, and reliability.
# If "use_coding_score" is true, coding_score replaces quality_score.
strategies:
  # For general-purpose queries where quality is most important, but not at any cost.
  default:
    quality_weight: 0.6
    cost_weight: 0.2
    latency_weight: 0.1
    reliability_weight: 0.1

  # For critical tasks where the absolute best-quality answer is required, regardless of cost.
  max_quality:
    quality_weight: 0.8
    cost_weight: 0.1
    latency_weight: 0.05
    reliability_weight: 0.05

  # For non-critical, bulk processing tasks where minimizing expense is the top priority.
  cost:
    quality_weight: 0.2
    cost_weight: 0.65
    latency_weight: 0.1
    reliability_weight: 0.05

  # For interactive, real-time applications where the speed of the response is paramount.
  latency:
    quality_weight: 0.2
    cost_weight: 0.1
    latency_weight: 0.65
    reliability_weight: 0.05

  # A versatile, all-around strategy for a good mix of performance.
  balanced:
    quality_weight: 0.4
    cost_weight: 0.3
    latency_weight: 0.2
    reliability_weight: 0.1

  # For all coding-related tasks, using the specialized 'coding_score' for quality.
  best-for-coding:
    use_coding_score: true
    quality_weight: 0.7
    cost_weight: 0.1
    latency_weight: 0.1
    reliability_weight: 0.1
  
  # --- Dynamic Strategies used by the "smart-balanced" mode ---

  # Used by 'smart-balanced' for expensive requests; prioritizes quality.
  quality-focused-balanced:
    quality_weight: 0.5
    cost_weight: 0.2
    latency_weight: 0.15
    reliability_weight: 0.15

  # Used by 'smart-balanced' for cheap requests; prioritizes speed.
  latency-focused-balanced:
    quality_weight: 0.3
    cost_weight: 0.25
    latency_weight: 0.3
    reliability_weight: 0.15

# ================================================================
# Image Strategy Definitions (Production-Optimized v2)
# ================================================================
image_strategies:
  # For realistic, high-quality photography-like images.
  photorealistic:
    quality_weight: 0.60   # maximize visual fidelity
    speed_weight: 0.10
    cost_weight: 0.10
    reliability_weight: 0.20

  # For creative, stylized, or imaginative outputs.
  artistic:
    use_artistic_score: true
    quality_weight: 0.50   # still care about fidelity
    speed_weight: 0.10
    cost_weight: 0.05      # cost is less important here
    reliability_weight: 0.35  # avoid broken results

  # For fast, cheap previews (drafts, thumbnails).
  fast_preview:
    quality_weight: 0.15   # willing to sacrifice fidelity
    speed_weight: 0.50     # prioritize responsiveness
    cost_weight: 0.25
    reliability_weight: 0.10

  # For clear, accurate technical diagrams and flowcharts.
  diagram:
    quality_weight: 0.70   # prioritize clarity/accuracy
    speed_weight: 0.10
    cost_weight: 0.05
    reliability_weight: 0.15

  # Smart “catch-all” fallback when intent is unclear.
  balanced:
    quality_weight: 0.50   # safe middle ground
    speed_weight: 0.15
    cost_weight: 0.15
    reliability_weight: 0.20
