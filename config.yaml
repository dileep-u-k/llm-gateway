# ================================================================
# PRICING
# Keep only values you actively use. Refresh regularly.
# ================================================================
model_costs:
  gpt-5.4:
    input: 0.0000025
    cached_input: 0.00000025
    output: 0.000015

  gpt-5.4-mini:
    input: 0.00000075
    cached_input: 0.000000075
    output: 0.0000045

  gpt-4o:
    input: 0.000005
    output: 0.00002

  claude-sonnet-4-6:
    input: 0.000003
    output: 0.000015

  claude-opus-4-7:
    input: 0.000005
    output: 0.000025

  gemini-2.5-flash:
    input: 0.00000045
    output: 0.0000027

  gemini-2.5-flash-lite:
    input: 0.000000125
    output: 0.00000075

  gemini-2.5-pro:
    input: 0.000002
    output: 0.000012

# ================================================================
# RETRIEVAL / MEMORY / CONTEXT
# ================================================================
retrieval:
  vector_store: "pinecone"
  top_k: 12
  rerank_top_k: 6
  chunking:
    strategy: "hybrid_semantic_structural"
    target_chunk_tokens: 700
    overlap_tokens: 100
    preserve_headers: true
    preserve_tables: true
  provenance:
    enabled: true
    include_source_title: true
    include_section: true
    include_version: true
  fallback_on_vector_failure:
    grounded_required: "fail"
    grounded_preferred: "degrade"
    best_effort: "continue"

memory:
  short_term_turn_limit: 12
  enable_summary_memory: true
  summary_refresh_every_turns: 4
  enable_working_memory: true
  preserve_artifact_refs: true
  compact_long_sessions: true

context_composer:
  max_context_budget_ratio: 0.8
  prioritize:
    - user_request
    - policy_constraints
    - force_scope_constraints
    - working_memory
    - retrieved_evidence
    - tool_outputs
    - summary_memory
  remove_duplicates: true
  preserve_provenance_blocks: true

# ================================================================
# TOOLS
# ================================================================
tools:
  enable_tool_planner: true
  default_timeout: "10s"
  default_retry_count: 1
  allow_parallel_tool_calls: true

  registry:
    web_search:
      capability: "external_lookup"
      timeout: "12s"
      retry_count: 1
      async_suitable: false

    calculator:
      capability: "utility_compute"
      timeout: "2s"
      retry_count: 0
      async_suitable: false

    ocr_parser:
      capability: "ocr"
      timeout: "20s"
      retry_count: 1
      async_suitable: true

    pdf_extractor:
      capability: "document_extraction"
      timeout: "20s"
      retry_count: 1
      async_suitable: true

# ================================================================
# EXECUTION PLANNER
# ================================================================
execution_planner:
  enable_stage_graphs: true
  max_sync_stages: 6
  plan_types:
    - direct_text_generation
    - retrieve_then_answer
    - ocr_then_reason
    - transcribe_then_summarize
    - image_analyze_then_synthesize
    - multimodal_compare_and_reason
    - image_generation_pipeline
    - image_edit_pipeline
    - tts_pipeline
    - async_heavy_workflow

  force_scope_rules:
    primary_reasoner_force:
      allow_auxiliary_specialists: true
    capability_scoped_force:
      allow_auxiliary_specialists: true
    strict_end_to_end_force:
      allow_auxiliary_specialists: false

# ================================================================
# STRATEGIES
# ================================================================
strategies:
  default:
    quality_weight: 0.55
    cost_weight: 0.15
    latency_weight: 0.10
    reliability_weight: 0.10
    policy_weight: 0.10

  max_quality:
    quality_weight: 0.70
    cost_weight: 0.05
    latency_weight: 0.05
    reliability_weight: 0.10
    policy_weight: 0.10

  cost:
    quality_weight: 0.15
    cost_weight: 0.60
    latency_weight: 0.10
    reliability_weight: 0.05
    policy_weight: 0.10

  latency:
    quality_weight: 0.15
    cost_weight: 0.10
    latency_weight: 0.55
    reliability_weight: 0.10
    policy_weight: 0.10

  balanced:
    quality_weight: 0.35
    cost_weight: 0.20
    latency_weight: 0.15
    reliability_weight: 0.15
    policy_weight: 0.15

  best_for_coding:
    use_coding_score: true
    quality_weight: 0.55
    cost_weight: 0.10
    latency_weight: 0.10
    reliability_weight: 0.10
    policy_weight: 0.15

  smart_balanced:
    mode: "dynamic_meta_strategy"
    cheap_path: "latency_focused_balanced"
    expensive_path: "quality_focused_balanced"

  quality_focused_balanced:
    quality_weight: 0.45
    cost_weight: 0.15
    latency_weight: 0.10
    reliability_weight: 0.15
    policy_weight: 0.15

  latency_focused_balanced:
    quality_weight: 0.25
    cost_weight: 0.20
    latency_weight: 0.25
    reliability_weight: 0.15
    policy_weight: 0.15

# ================================================================
# IMAGE / GENERATION STRATEGIES
# ================================================================
image_strategies:
  photorealistic:
    quality_weight: 0.55
    artistic_weight: 0.10
    speed_weight: 0.10
    cost_weight: 0.05
    reliability_weight: 0.20

  artistic:
    quality_weight: 0.35
    artistic_weight: 0.35
    speed_weight: 0.05
    cost_weight: 0.05
    reliability_weight: 0.20

  fast_preview:
    quality_weight: 0.10
    artistic_weight: 0.10
    speed_weight: 0.45
    cost_weight: 0.20
    reliability_weight: 0.15

  diagram:
    quality_weight: 0.60
    artistic_weight: 0.05
    speed_weight: 0.10
    cost_weight: 0.05
    reliability_weight: 0.20

  balanced:
    quality_weight: 0.40
    artistic_weight: 0.15
    speed_weight: 0.15
    cost_weight: 0.10
    reliability_weight: 0.20

# ================================================================
# ROUTE POLICIES
# ================================================================
route_policies:
  default:
    strategy: default
    avoid_degraded_providers: false
    allow_degraded_fallback: true

  balanced:
    strategy: balanced
    avoid_degraded_providers: false
    allow_degraded_fallback: true

  smart_balanced:
    strategy: smart_balanced
    avoid_degraded_providers: false
    allow_degraded_fallback: true

  max_quality:
    strategy: max_quality
    preferred_providers: ["openai", "anthropic", "google"]
    avoid_degraded_providers: true
    allow_degraded_fallback: true

  cost:
    strategy: cost
    preferred_providers: ["google", "mistral"]
    avoid_degraded_providers: false
    allow_degraded_fallback: true

  latency:
    strategy: latency
    preferred_providers: ["google", "openai", "mistral"]
    avoid_degraded_providers: true
    allow_degraded_fallback: true

  best_for_coding:
    strategy: best_for_coding
    preferred_providers: ["openai", "anthropic"]
    avoid_degraded_providers: true
    allow_degraded_fallback: true

  force_strict:
    strategy: default
    avoid_degraded_providers: true
    allow_degraded_fallback: false

# ================================================================
# FALLBACK GRAPHS
# ================================================================
fallback_graphs:
  text_generation:
    default: ["gpt-5.4", "claude-sonnet-4-6", "gpt-4o", "gemini-2.5-pro", "mistral-large-3", "gemini-2.5-flash"]
    balanced: ["gpt-4o", "claude-sonnet-4-6", "gemini-2.5-flash", "mistral-large-3", "gpt-5.4"]
    smart_balanced: ["gemini-2.5-flash-lite", "gemini-2.5-flash", "mistral-large-3", "gpt-4o", "claude-sonnet-4-6"]
    max_quality: ["gpt-5.4", "claude-opus-4-7", "claude-sonnet-4-6", "gpt-4o", "gemini-2.5-pro"]
    cost: ["gemini-2.5-flash-lite", "gemini-2.5-flash", "mistral-large-3", "gpt-4o"]
    latency: ["gemini-2.5-flash-lite", "gemini-2.5-flash", "gpt-4o", "mistral-large-3"]
    best_for_coding: ["gpt-5.4-mini", "gpt-5.4", "claude-sonnet-4-6", "gpt-4o"]
    force_strict: []

  embeddings:
    default: ["provider_native_embedding", "fallback_embedding"]
    balanced: ["provider_native_embedding", "fallback_embedding"]

  ocr:
    default: ["ocr-3-premier", "provider_vision_ocr_fallback"]
    balanced: ["ocr-3-premier", "provider_vision_ocr_fallback"]

  transcription:
    default: ["gpt-4o-transcribe-diarize", "voxtral-mini-transcribe-realtime", "gpt-realtime-1.5"]
    balanced: ["voxtral-mini-transcribe-realtime", "gpt-4o-transcribe-diarize", "gpt-realtime-1.5"]

  image_understanding:
    default: ["gpt-4o", "gemini-2.5-pro", "gemini-2.5-flash", "mistral-large-3"]
    balanced: ["gemini-2.5-flash", "gpt-4o", "mistral-large-3", "gemini-2.5-pro"]

  image_generation:
    default: ["gpt-image-1.5", "imagen-4-generate"]
    balanced: ["gpt-image-1.5", "imagen-4-generate"]

  image_editing:
    default: ["gpt-image-1.5"]
    balanced: ["gpt-image-1.5"]

  tts:
    default: ["gpt-4o-mini-tts", "gemini-2.5-flash-tts", "tts-1-hd"]
    balanced: ["gpt-4o-mini-tts", "gemini-2.5-flash-tts", "tts-1-hd"]

  video_understanding:
    default: ["gemini-2.5-pro", "gemini-2.5-flash", "gpt-4o"]
    balanced: ["gemini-2.5-flash", "gemini-2.5-pro", "gpt-4o"]

# ================================================================
# ASYNC RUNTIME
# ================================================================
async_runtime:
  enabled: true
  queue_backend: "redis_or_queue_service"
  default_priority: "normal"
  checkpointing_enabled: true
  max_retries_per_stage: 2
  dead_letter_enabled: true

# ================================================================
# OBSERVABILITY
# ================================================================
observability:
  metrics_enabled: true
  tracing_enabled: true
